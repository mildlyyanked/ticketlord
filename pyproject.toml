[project]
name = "ticketlord"
version = "0.1.0"
description = "Get a phone push with the ticket link whenever Revival Hub lists a new LA screening"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=4.9",
    "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
js = ["playwright>=1.40"]
dev = ["pytest>=7"]

[project.scripts]
ticketlord = "ticketlord.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ticketlord"]
