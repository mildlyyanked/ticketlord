name: Check screenings

on:
  schedule:
    # Twice an hour, off the busy :00 slot. GitHub silently drops many runs of very frequent
    # schedules, and the Revival Hub feed is cached for up to an hour anyway.
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      test_notification:
        description: "Also send a test push to my phone"
        type: boolean
        default: false
      preview:
        description: "Only list what each source finds (no notifications)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: check-screenings
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install .
      - name: Check revivalhub for new screenings
        env:
          TICKETLORD_URL: ${{ vars.TICKETLORD_URL || 'https://revivalhub.com/' }}
          TICKETLORD_KEYWORDS: ${{ vars.TICKETLORD_KEYWORDS }}
          TICKETLORD_ONLY_KEYWORDS: ${{ vars.TICKETLORD_ONLY_KEYWORDS }}
          TICKETLORD_BATCH_OVER: ${{ vars.TICKETLORD_BATCH_OVER }}
          TICKETLORD_SOURCES: ${{ vars.TICKETLORD_SOURCES }}
          TICKETLORD_REGIONS: ${{ vars.TICKETLORD_REGIONS }}
          TICKETLORD_WIDE_RELEASE: ${{ vars.TICKETLORD_WIDE_RELEASE }}
          TICKETLORD_STATE_FILE: state/seen.json
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
          PUSHOVER_APP_TOKEN: ${{ secrets.PUSHOVER_APP_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ inputs.preview }}" = "true" ]; then
            ticketlord inspect > preview.txt || true
            grep -A4 -E "\[(cinematheque|academy|amc)\]" preview.txt | head -150
            exit 0
          fi
          if [ -z "$NTFY_TOPIC$PUSHOVER_USER_KEY$TELEGRAM_BOT_TOKEN" ]; then
            echo "::warning::No notification channel set up yet. Add an NTFY_TOPIC secret under Settings > Secrets and variables > Actions."
            exit 0
          fi
          if [ "${{ inputs.test_notification }}" = "true" ]; then ticketlord test-notify; fi
          ticketlord check
      - name: Save seen screenings
        if: always()
        run: |
          git config user.name "ticketlord-bot"
          git config user.email "ticketlord-bot@users.noreply.github.com"
          git add state/seen.json 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git commit -m "Update seen screenings [skip ci]"
          git pull --rebase && git push
